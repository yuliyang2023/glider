name: Build Oray X1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - name: Test build profiles
        run: |
          go test ./...
          go test -tags oray_lite ./...
          go test -tags oray_vmess ./...
          go test -tags oray_vmess_tls ./...

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [full, lite, vmess, vmess-tls]
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: mipsle
      GOMIPS: softfloat
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true
      - name: Build stripped static MIPS little-endian binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tags=()
          case '${{ matrix.profile }}' in
            lite) tags=(-tags oray_lite) ;;
            vmess) tags=(-tags oray_vmess) ;;
            vmess-tls) tags=(-tags oray_vmess_tls) ;;
          esac
          go build -trimpath -buildvcs=false "${tags[@]}" -ldflags='-s -w -buildid=' -o dist/glider-oray-x1-${{ matrix.profile }} .
          go version -m dist/glider-oray-x1-${{ matrix.profile }} > dist/BUILD-INFO.txt
          git rev-parse HEAD >> dist/BUILD-INFO.txt
      - name: Verify ELF and smoke tests on MIPS 24KEc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          file dist/glider-oray-x1-${{ matrix.profile }}
          readelf -h dist/glider-oray-x1-${{ matrix.profile }}
          if readelf -l dist/glider-oray-x1-${{ matrix.profile }} | grep -q INTERP; then exit 1; fi
          timeout 15 qemu-mipsel -cpu 24KEc dist/glider-oray-x1-${{ matrix.profile }} -h > dist/HELP.txt
          smoke_args=()
          case '${{ matrix.profile }}' in vmess*) smoke_args=(--vmess-only) ;; esac
          python3 scripts/oray-smoke.py dist/glider-oray-x1-${{ matrix.profile }} "${smoke_args[@]}"
      - name: Package and report sizes
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          binary=glider-oray-x1-${{ matrix.profile }}
          gzip -9 -n -k "$binary"
          sha256sum "$binary" "$binary.gz" > SHA256SUMS
          cp ../ORAY-X1.md ../LICENSE .
          raw=$(stat -c %s "$binary")
          compressed=$(stat -c %s "$binary.gz")
          printf '%s\n' "### Oray X1 ${{ matrix.profile }}" "- Binary: $raw bytes" "- gzip download: $compressed bytes" "- linux/mipsle, softfloat, CGO disabled, Go 1.24.13" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: glider-oray-x1-${{ matrix.profile }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
